<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>黒工電子科 ARCADE — システム選択</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

  :root{
    --bg:#030812; --grid:rgba(0,229,255,0.05); --text:#c8f0ff;
    --cyan:#00e5ff; --gold:#ffd700; --orange:#ff6d00; --purple:#9d4edd;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{height:100%;}
  body{
    background:var(--bg);color:var(--text);font-family:'Orbitron',monospace;
    min-height:100vh;min-height:100dvh;position:relative;overflow-x:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 20px 48px;
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(var(--grid) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:40px 40px;animation:gridScroll 8s linear infinite;
  }
  @keyframes gridScroll{0%{transform:translateY(0);}100%{transform:translateY(40px);}}
  body::after{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.15) 2px,rgba(0,0,0,.15) 4px);
  }
  #vignette{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,4,.6) 100%);}

  .eyebrow{position:relative;z-index:3;font-family:'Share Tech Mono',monospace;font-size:clamp(10px,2.6vw,12px);
    letter-spacing:8px;color:rgba(0,229,255,.6);margin-bottom:12px;text-align:center;}
  .hub-title{position:relative;z-index:3;font-size:clamp(30px,9vw,52px);font-weight:900;letter-spacing:6px;
    color:#fff;text-align:center;line-height:1.15;text-shadow:0 0 24px rgba(0,229,255,.5);margin-bottom:6px;}
  .hub-sub{position:relative;z-index:3;font-family:'Share Tech Mono',monospace;font-size:clamp(11px,2.8vw,13px);
    color:rgba(200,240,255,.55);text-align:center;max-width:480px;margin-bottom:34px;letter-spacing:1px;line-height:1.7;}

  .hub-selector{position:relative;z-index:3;display:grid;grid-template-columns:1fr;gap:18px;
    width:100%;max-width:420px;}
  @media(min-width:640px){.hub-selector{grid-template-columns:1fr 1fr;max-width:760px;}}

  .hub-card{position:relative;border-radius:14px;padding:26px 20px;cursor:pointer;
    background:rgba(255,255,255,.02);border:1.5px solid var(--card-border);
    box-shadow:0 0 0 rgba(0,0,0,0);transition:transform .18s,box-shadow .18s,background .18s;
    display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;
    min-height:190px;}
  .hub-card:active{transform:scale(.96);}
  @media(hover:hover){
    .hub-card:hover{background:var(--card-glow);box-shadow:0 0 32px var(--card-shadow);transform:translateY(-2px);}
  }
  .hub-card.c-runner{--card-border:rgba(0,243,255,.35);--card-glow:rgba(0,243,255,.08);--card-shadow:rgba(0,243,255,.35);}
  .hub-card.c-algo{--card-border:rgba(255,109,0,.35);--card-glow:rgba(255,109,0,.08);--card-shadow:rgba(255,109,0,.35);}

  .hub-card-tag{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:3px;opacity:.55;}
  .hub-card-icon{font-size:34px;line-height:1;}
  .hub-card-name{font-size:clamp(18px,4.6vw,24px);font-weight:900;letter-spacing:2px;line-height:1.25;}
  .c-runner .hub-card-name{color:var(--cyan);}
  .c-algo .hub-card-name{color:var(--orange);}
  .hub-card-desc{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.5px;
    color:rgba(200,220,255,.55);line-height:1.7;margin-top:auto;}

  .hub-footer{position:relative;z-index:3;margin-top:30px;font-family:'Share Tech Mono',monospace;
    font-size:9px;letter-spacing:3px;color:rgba(200,240,255,.3);text-align:center;}
</style>
</head>
<body>
<div id="vignette"></div>
<div class="eyebrow">▶ 黒工電子科 — アーケードシステム</div>
<div class="hub-title">SYSTEM SELECT</div>
<div class="hub-sub">遊びたいアーケードを選んでほしい。それぞれ独立したシステムとして動作する。</div>

<div class="hub-selector">
  <a class="hub-card c-runner" href="cyberrunner/index.html">
    <div class="hub-card-tag">SYSTEM 01 — ランニングアクション</div>
    <div class="hub-card-icon">🏃</div>
    <div class="hub-card-name">CYBER RUNNER</div>
    <div class="hub-card-desc">サイバーパンクな障害物ランナー。ジャンプ・しゃがみ・スキルで駆け抜けろ。ガチャ・図鑑・ランキングあり。</div>
  </a>

  <a class="hub-card c-algo" href="algo-arcade/game.html">
    <div class="hub-card-tag">SYSTEM 02 — アルゴリズム体験</div>
    <div class="hub-card-icon">🧠</div>
    <div class="hub-card-name">ALGO ARCADE</div>
    <div class="hub-card-desc">仕分け・整列・暗算・マージソートを遊んで体に叩き込む、4モジュール構成の頭脳系アーケード。</div>
  </a>
</div>

<div class="hub-footer">SELECT A SYSTEM TO BEGIN</div>
</body>
</html>
